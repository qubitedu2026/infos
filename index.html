<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quBit — Zeitplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#1B2430;
    --paper:#FAFAF8;
    --card:#FFFFFF;
    --slate:#6B7280;
    --border:#E3E1D9;
    --rail:#C9C6BA;
    --brand:#00549F;
    --red:#B0332E;
    --amber-bg:#FBEFD9;
    --amber-fg:#8A5A16;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 4rem;}
  header{margin-bottom:1.5rem;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin:0 0 6px;
  }
  .header-row{display:flex;align-items:stretch;gap:18px;}
  .venue-line{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);
    margin:0 0 6px;
  }
  .venue-line .venue-top{display:flex;align-items:center;gap:5px;}
  .venue-line .venue-addr{margin-left:17px;}
  .venue-line svg{flex-shrink:0;color:var(--slate);}
  .venue-line a{color:var(--slate);text-decoration:underline;}
  .venue-line a:hover{color:var(--brand);}
  .site-logo{
    height:auto;
    width:auto;
    max-width:140px;
    align-self:stretch;
    object-fit:contain;
    border-radius:10px;
    flex-shrink:0;
  }
  .header-text{display:flex;flex-direction:column;justify-content:flex-start;min-width:0;}
  .header-text .toolbar{margin-top:auto;padding-top:10px;}
  h1{font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.2;}
  .subtitle{font-size:15px;color:var(--slate);margin:0;}

  .toolbar{display:flex;align-items:center;gap:10px;margin-top:1.25rem;flex-wrap:wrap;}
  .lang-switch{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
  .lang-switch button{
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;
    border:none;background:var(--paper);color:var(--ink);padding:7px 14px;cursor:pointer;
  }
  .lang-switch button.active{background:var(--ink);color:var(--paper);}
  .lang-switch button:hover{opacity:0.85;}
  .feedback-jump{white-space:nowrap;}

  .announcement{
    margin-top:1.25rem;
    background:var(--amber-bg);
    color:var(--amber-fg);
    border:1px solid #E8C888;
    border-radius:8px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
  }
  .announcement b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:2rem 0 1.25rem;flex-wrap:wrap;}
  .tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 14px;color:var(--slate);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500;}

  .track-columns-header{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .track-col-head{display:flex;align-items:center;gap:12px;padding:0 14px 6px;border-bottom:1px solid var(--border);}
  .track-col-head .time-gutter{width:100px;flex-shrink:0;}
  .track-col-head .col-label{
    flex:1;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--slate);text-align:center;
  }
  .track-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start;}
  .track-col{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .track-col .session{margin-bottom:0;}
  @media (max-width:520px){
    .track-row{grid-template-columns:1fr;}
    .track-columns-header{display:none;}
  }

  .session{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .session.changed{border-color:#D9A441;}
  .session-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .session.full .session-head{display:grid;grid-template-columns:110px 1fr 110px;gap:12px;align-items:center;}
  .session.full .time-badge{min-width:0;}
  .session.full .chevron{justify-self:center;}
  .session.no-details .session-head{cursor:default;}
  .session.full .head-top{justify-content:center;}
  .session.full .stitle{text-align:center;}
  .tag-title{
    font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;
    padding:5px 12px;border-radius:7px;display:inline-block;line-height:1.3;
  }
  .time-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);white-space:nowrap;width:100px;flex-shrink:0;}
  .head-main{flex:1;min-width:0;}
  .head-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .head-top-stacked{flex-direction:column;align-items:flex-start;gap:5px;}
  .stitle{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;margin:0;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .track-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--border);color:var(--slate);white-space:nowrap;
  }
  .changed-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;
    background:#F6D98A;color:#5C3E07;white-space:nowrap;
  }
  .chevron{font-size:40px;color:var(--slate);transition:transform 0.15s;flex-shrink:0;line-height:1;}
  .session.open .chevron{transform:rotate(90deg);}
  .session-body{display:none;padding:0 14px 14px 100px;font-size:14px;color:var(--ink);}
  .session-body-wide{padding-left:14px;}
  .session.open .session-body{display:block;}
  .body-line{margin:4px 0;color:var(--slate);font-size:13px;}
  .body-line b{color:var(--ink);font-weight:500;}
  .abstract-text{margin-top:8px;line-height:1.6;white-space:pre-wrap;}
  .placeholder-text{color:var(--slate);font-style:italic;}
  .hinweis-box{
    background:var(--amber-bg);color:var(--amber-fg);border-radius:6px;padding:8px 10px;
    font-size:13px;margin-bottom:8px;
  }

  .poster-list{border-top:1px solid var(--border);margin-top:2px;}
  .poster-item{border-bottom:1px solid var(--border);}
  .poster-item-head{
    display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;
  }
  .poster-item-flat .poster-item-head{cursor:default;}
  .poster-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .poster-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;line-height:1.35;}
  .poster-author{font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--slate);}
  .poster-chevron{font-size:18px;color:var(--slate);flex-shrink:0;transition:transform 0.15s;}
  .poster-item.open .poster-chevron{transform:rotate(90deg);}
  .poster-item-body{display:none;padding:0 0 12px;}
  .poster-item.open .poster-item-body{display:block;}
  .poster-item-body .abstract-text{margin-top:0;font-size:13px;}

  .workshop-list{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .workshop-group-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--slate);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .workshop-item{margin-bottom:12px;}
  .workshop-item:last-child{margin-bottom:0;}
  .workshop-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;margin:0 0 2px;line-height:1.35;}
  .workshop-institution{font-size:12px;color:var(--slate);margin:0;}
  @media (max-width:520px){
    .workshop-list{grid-template-columns:1fr;gap:16px;}
  }

  .lageplan-section{margin-top:2.5rem;}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate);margin:0 0 10px;}
  .lageplan-frame{
    width:100%;max-height:600px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--paper);
  }
  .lageplan-frame iframe{width:100%;height:480px;border:none;background:var(--paper);}
  .lageplan-caption{font-size:12px;color:var(--slate);margin-top:6px;}

  .footer-note{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);font-size:12px;color:var(--slate);}
  .feedback-section{margin-top:2.5rem;}
  .feedback-textarea{
    width:100%;min-height:100px;font-family:'Space Grotesk',sans-serif;font-size:14px;
    padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--ink);resize:vertical;box-sizing:border-box;
  }
  .feedback-textarea:focus{outline:1px solid var(--brand);}
  .feedback-row{display:flex;align-items:center;gap:12px;margin-top:8px;}
  .feedback-status{font-size:12px;color:var(--slate);}
  .empty{padding:2rem 0;color:var(--slate);font-size:14px;}
  .state-msg{padding:3rem 0;text-align:center;color:var(--slate);font-size:14px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>

const t = () => STR[lang];
function pickLang(de, en){
  if(lang === 'de') return de || en || '';
  return en || de || '';
}

const SHEET_GIDS = {
  'Montag': '1074899021',
  'Dienstag': '2010712504',
  'Mittwoch': '716452524',
  'Lageplan': '32789645',
  'Allgemeines': '212944011',
  'Poster': '2015953945',
  'Workshops': '1869257230'
};

function sheetUrl(name){
  const gid = SHEET_GIDS[name];
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
}

function fetchSheet(name){
  return new Promise((resolve, reject) => {
    Papa.parse(sheetUrl(name), {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: res => resolve(res.data),
      error: err => reject(err)
    });
  });
}

function buildDay(label_de, label_en, rows){
  const sessions = rows
    .filter(r => (r.Start && r.Start.trim()) || (r.Titel_DE && r.Titel_DE.trim()) || (r.Titel_EN && r.Titel_EN.trim()))
    .map((r, i) => ({
      id: label_de + '-' + i,
      track: (r.Track || '').trim() || 'both',
      start: (r.Start || '').trim(),
      end: (r.Ende || '').trim(),
      type: (r.Typ || '').trim().toLowerCase(),
      title_de: (r.Titel_DE || '').trim(),
      title_en: (r.Titel_EN || '').trim(),
      speaker: (r.Vortragende || '').trim(),
      authors: (r.Autor_innen || '').trim(),
      institution: (r.Institution || '').trim(),
      room: (r.Raum || '').trim(),
      abstract: (r.Abstract || '').trim(),
      abstract_en: (r.Abstract_EN || '').trim(),
      hinweis: (r.Hinweis || '').trim(),
      slot: (r.Vortragsnummer || '').toString().trim() || null
    }));
  return { label_de, label_en, sessions };
}

function buildPosters(rows){
  return rows
    .filter(r => (r.Titel_DE && r.Titel_DE.trim()) || (r.Titel_EN && r.Titel_EN.trim()))
    .map((r, i) => ({
      id: 'poster-' + i,
      title_de: (r.Titel_DE || '').trim(),
      title_en: (r.Titel_EN || '').trim(),
      author: (r.Autor_in || '').trim(),
      authors: (r.Autor_innen || '').trim(),
      institution: (r.Institution || '').trim(),
      abstract: (r.Abstract || '').trim(),
      abstract_en: (r.Abstract_EN || '').trim()
    }));
}

function buildWorkshops(rows){
  return rows
    .filter(r => (r.Titel_DE && r.Titel_DE.trim()) || (r.Titel_EN && r.Titel_EN.trim()))
    .map((r, i) => ({
      id: 'workshop-' + i,
      slot: (r.Slot || '').toString().trim() ? parseInt(r.Slot, 10) : null,
      track: (r.Track || '').trim() || 'A',
      title_de: (r.Titel_DE || '').trim(),
      title_en: (r.Titel_EN || '').trim(),
      institution: (r.Institution || '').trim()
    }));
}

function fieldMap(rows){
  const map = {};
  rows.forEach(r => {
    if(r.Feld) map[r.Feld.trim()] = (r.Wert || '').trim();
  });
  return map;
}

function driveFileId(link){
  if(!link) return null;
  let m = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  m = link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function driveEmbedUrl(link){
  if(link && link.startsWith('data:')) return null;
  const id = driveFileId(link);
  if(!id) return null;
  return `https://drive.google.com/file/d/${id}/preview`;
}

function driveImageUrl(link){
  if(link && link.startsWith('data:')) return link;
  const id = driveFileId(link);
  if(!id) return null;
  return `https://drive.google.com/uc?export=view&id=${id}`;
}

async function loadAll(){
  try{
    const [mo, di, mi, lp, allg, po, ws] = await Promise.all([
      fetchSheet('Montag'), fetchSheet('Dienstag'), fetchSheet('Mittwoch'),
      fetchSheet('Lageplan'), fetchSheet('Allgemeines'),
      fetchSheet('Poster'), fetchSheet('Workshops')
    ]);
    state.days = [
      buildDay('Montag', 'Monday', mo),
      buildDay('Dienstag', 'Tuesday', di),
      buildDay('Mittwoch', 'Wednesday', mi)
    ];
    const lpMap = fieldMap(lp);
    state.lageplan = {
      link: lpMap['Bild-/PDF-Link'] || '',
      caption: lpMap['Beschriftung (optional)'] || ''
    };
    state.allg = fieldMap(allg);
    state.posters = buildPosters(po);
    state.workshops = buildWorkshops(ws);
    render();
  }catch(e){
    console.error(e);
    el('mainContent').innerHTML = `<p class="state-msg">${t().errorMsg}</p>`;
  }
}

el('feedbackJump').addEventListener('click', () => {
  el('feedbackSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  el('feedbackText').focus();
});

el('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  lang = btn.dataset.lang;
  render();
});

function timeToMinutes(time){
  if(!time) return 99999;
  const [h, m] = time.split(':').map(Number);
  return h * 60 + m;
}

function trackLabel(track){
  const L = t();
  if(track === 'A') return L.trackA;
  if(track === 'B') return L.trackB;
  return '';
}

function buildWorkshopList(slot){
  const L = t();
  const items = (state.workshops || []).filter(w => w.slot === slot);
  const group = (label, arr) => {
    if(arr.length === 0) return '';
    const rows = arr.map(w => `
      <div class="workshop-item">
        <p class="workshop-title">${escapeHtml(pickLang(w.title_de, w.title_en))}</p>
        <p class="workshop-institution">${escapeHtml(w.institution)}</p>
      </div>
    `).join('');
    return `<div class="workshop-group"><p class="workshop-group-label">${label}</p>${rows}</div>`;
  };
  const html = group(L.trackA, items.filter(w => w.track === 'A')) + group(L.trackB, items.filter(w => w.track === 'B'));
  return `<div class="workshop-list">${html}</div>`;
}

function buildPosterList(){
  const L = t();
  const items = (state.posters || []).map(p => {
    const ptitle = pickLang(p.title_de, p.title_en);
    const pabstract = pickLang(p.abstract, p.abstract_en);
    const hasAbstract = !!pabstract;
    return `
      <div class="poster-item${hasAbstract ? '' : ' poster-item-flat'}" data-poster-id="${p.id}">
        <div class="poster-item-head">
          <div class="poster-item-text">
            <span class="poster-title">${escapeHtml(ptitle)}</span>
            <span class="poster-author">${escapeHtml(p.author)}${p.institution ? ' · ' + escapeHtml(p.institution) : ''}</span>
          </div>
          ${hasAbstract ? '<span class="poster-chevron">▸</span>' : ''}
        </div>
        ${hasAbstract ? `<div class="poster-item-body">
          ${p.authors ? `<p class="body-line" style="margin-bottom:6px;"><b>${L.authorsLabel}</b> ${escapeHtml(p.authors)}</p>` : ''}
          <div class="abstract-text">${escapeHtml(pabstract)}</div>
        </div>` : ''}
      </div>
    `;
  }).join('');
  return `<div class="poster-list">${items}</div>`;
}

function attachPosterListeners(container){
  container.querySelectorAll('.poster-item:not(.poster-item-flat)').forEach(item => {
    item.querySelector('.poster-item-head').addEventListener('click', (e) => {
      e.stopPropagation();
      const id = item.dataset.posterId;
      if(openPosterIds.has(id)) openPosterIds.delete(id); else openPosterIds.add(id);
      item.classList.toggle('open');
    });
    if(openPosterIds.has(item.dataset.posterId)) item.classList.add('open');
  });
}

function buildSessionCard(sess){
  const L = t();
  const type = TYPES[sess.type] || TYPES.sonstiges;
  const title = pickLang(sess.title_de, sess.title_en);
  const isTalk = sess.type === 'vortrag';
  const isPoster = sess.type === 'poster';
  const isWorkshop = sess.type === 'experimentieren' && sess.track === 'both';
  const workshopSlotMatch = isWorkshop ? (sess.title_de + ' ' + sess.title_en).match(/Slot\s*(\d+)/i) : null;
  const workshopSlot = workshopSlotMatch ? parseInt(workshopSlotMatch[1], 10) : null;
  const hasDetails = isPoster
    ? (state.posters && state.posters.length > 0)
    : isWorkshop
      ? (state.workshops && state.workshops.some(w => w.slot === workshopSlot))
      : !!(sess.speaker || sess.room || sess.abstract || sess.abstract_en || sess.hinweis);
  const isFull = sess.track === 'both';
  const hasHinweis = !!sess.hinweis;

  const card = document.createElement('div');
  card.className = 'session' + (isFull ? ' full' : '') + (hasHinweis ? ' changed' : '') + (openIds.has(sess.id) ? ' open' : '') + (hasDetails ? '' : ' no-details');

  const timeText = sess.start ? (sess.end ? `${sess.start} – ${sess.end}` : `${lang === 'de' ? 'ab' : 'from'} ${sess.start}`) : '';
  const trackChip = trackLabel(sess.track) ? `<span class="track-chip">${trackLabel(sess.track)}</span>` : '';
  const changedChip = hasHinweis ? `<span class="changed-chip">${L.changed}</span>` : '';

  const tagHtml = isTalk
    ? `<span class="tag" style="background:${type.bg};color:${type.fg}">${escapeHtml(sess.speaker || type[lang])}</span>`
    : '';
  const talkLabel = isTalk && sess.slot ? `${type[lang]} ${sess.slot}` : title;
  const titleHtml = isTalk
    ? `<p class="stitle">${escapeHtml(talkLabel || '')}</p>`
    : `<span class="tag-title" style="background:${type.bg};color:${type.fg}">${escapeHtml(title || '')}</span>`;
  const chevronHtml = hasDetails ? '<span class="chevron">▸</span>' : '';

  const headTopClass = isTalk ? 'head-top head-top-stacked' : 'head-top';

  card.innerHTML = `
    <div class="session-head">
      <span class="time-badge">${timeText}</span>
      <div class="head-main">
        <div class="${headTopClass}">
          ${titleHtml}
          ${tagHtml}
          ${trackChip}
          ${changedChip}
        </div>
      </div>
      ${chevronHtml}
    </div>
    ${hasDetails ? `
    <div class="session-body${(isPoster || isWorkshop) ? ' session-body-wide' : ''}">
      ${sess.hinweis ? `<div class="hinweis-box"><b>${L.hinweisLabel}:</b> ${escapeHtml(sess.hinweis)}</div>` : ''}
      ${isPoster ? buildPosterList() : isWorkshop ? buildWorkshopList(workshopSlot) : `
        ${sess.speaker ? `<p class="body-line"><b>${L.speakerLabel}</b> ${escapeHtml(sess.speaker)}</p>` : ''}
        ${sess.institution ? `<p class="body-line"><b>${L.institutionLabel}</b> ${escapeHtml(sess.institution)}</p>` : ''}
        ${isTalk ? `<p class="body-line"><b>${L.titleLabel}</b> ${escapeHtml(title || '')}</p>` : ''}
        ${sess.room ? `<p class="body-line"><b>${sess.type === 'dinner' ? L.locationLabel : L.roomLabel}</b> ${sess.type === 'dinner' ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(sess.room)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">${escapeHtml(sess.room)}</a>` : escapeHtml(sess.room)}</p>` : ''}
        ${sess.authors ? `<p class="body-line"><b>${L.authorsLabel}</b> ${escapeHtml(sess.authors)}</p>` : ''}
        ${(() => { const a = pickLang(sess.abstract, sess.abstract_en); return a ? `<div class="abstract-text">${escapeHtml(a)}</div>` : ''; })()}
      `}
    </div>` : ''}
  `;
  if(hasDetails){
    card.querySelector('.session-head').addEventListener('click', () => {
      if(openIds.has(sess.id)) openIds.delete(sess.id); else openIds.add(sess.id);
      card.classList.toggle('open');
    });
    if(isPoster){
      attachPosterListeners(card);
    }
  }
  return card;
}

function groupByStart(sessions){
  const map = new Map();
  sessions.forEach(sess => {
    const key = sess.start || ('_' + sess.id);
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(sess);
  });
  return [...map.values()].sort((a, b) => timeToMinutes(a[0].start) - timeToMinutes(b[0].start));
}

function renderDay(day){
  const wrap = document.createElement('div');
  const L = t();
  if(day.sessions.length === 0){
    wrap.innerHTML = `<p class="empty">${L.noEntries}</p>`;
    return wrap;
  }
  const hasParallelTracks = day.sessions.some(sess => sess.track === 'A' || sess.track === 'B');
  if(hasParallelTracks){
    const header = document.createElement('div');
    header.className = 'track-columns-header';
    header.innerHTML = `
      <div class="track-col-head"><span class="time-gutter"></span><span class="col-label">${L.trackA}</span></div>
      <div class="track-col-head"><span class="time-gutter"></span><span class="col-label">${L.trackB}</span></div>
    `;
    wrap.appendChild(header);
  }
  const groups = groupByStart(day.sessions);
  groups.forEach(group => {
    const bothArr = group.filter(sess => sess.track === 'both');
    const aArr = group.filter(sess => sess.track === 'A');
    const bArr = group.filter(sess => sess.track === 'B');
    bothArr.forEach(sess => wrap.appendChild(buildSessionCard(sess)));
    if(aArr.length > 0 || bArr.length > 0){
      const row = document.createElement('div');
      row.className = 'track-row';
      const colA = document.createElement('div');
      colA.className = 'track-col';
      aArr.forEach(sess => colA.appendChild(buildSessionCard(sess)));
      const colB = document.createElement('div');
      colB.className = 'track-col';
      bArr.forEach(sess => colB.appendChild(buildSessionCard(sess)));
      row.appendChild(colA);
      row.appendChild(colB);
      wrap.appendChild(row);
    }
  });
  return wrap;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderTabs(){
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  state.days.forEach((day, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (i === activeDayIndex ? ' active' : '');
    tab.textContent = pickLang(day.label_de, day.label_en);
    tab.addEventListener('click', () => { activeDayIndex = i; render(); });
    tabs.appendChild(tab);
  });
  return tabs;
}

function renderLageplan(){
  const area = el('lageplanArea');
  area.innerHTML = '';
  if(!state.lageplan || !state.lageplan.link) return;
  const embed = driveEmbedUrl(state.lageplan.link);
  const imgUrl = driveImageUrl(state.lageplan.link);
  if(!embed && !imgUrl) return;
  const L = t();
  const section = document.createElement('div');
  section.className = 'lageplan-section';
  section.innerHTML = `
    <p class="section-title">${L.lageplan}</p>
    <div class="lageplan-frame">
      <img id="lageplanImg" src="${imgUrl || ''}" alt="Lageplan" style="width:100%;height:auto;max-height:600px;object-fit:contain;background:var(--paper);display:block;">
      <iframe id="lageplanFallback" src="${embed || ''}" style="display:none;width:100%;height:100%;border:none;" allow="autoplay"></iframe>
    </div>
    ${state.lageplan.caption ? `<p class="lageplan-caption">${escapeHtml(state.lageplan.caption)}</p>` : ''}
  `;
  const img = section.querySelector('#lageplanImg');
  img.addEventListener('error', () => {
    img.style.display = 'none';
    if(embed) section.querySelector('#lageplanFallback').style.display = 'block';
  });
  area.appendChild(section);
}

function render(){
  const L = t();
  const titleKey = lang === 'de' ? 'Titel (DE)' : 'Titel (EN)';
  const subKey = lang === 'de' ? 'Untertitel (DE)' : 'Untertitel (EN)';
  const annKey = lang === 'de' ? 'Ankündigung (DE)' : 'Ankündigung (EN)';

  el('venueLine').innerHTML = `
    <span class="venue-top"><svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/></svg> ${L.venueName}</span>
    <a class="venue-addr" href="https://www.google.com/maps/search/?api=1&query=Cla%C3%9Fenstra%C3%9Fe+11+52072+Aachen" target="_blank" rel="noopener">${L.venueAddress}</a>
  `;
  el('title').textContent = pickLang(state.allg['Titel (DE)'], state.allg['Titel (EN)']) || 'Zeitplan';
  el('subtitle').textContent = pickLang(state.allg['Untertitel (DE)'], state.allg['Untertitel (EN)']);
  el('footerNote').textContent = L.footerHint;

  const ann = state.allg[annKey];
  const annArea = el('announcementArea');
  annArea.innerHTML = ann
    ? `<div class="announcement"><b>${L.ankuendigung}</b>${escapeHtml(ann)}</div>`
    : '';

  el('langSwitch').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  const content = el('mainContent');
  content.innerHTML = '';
  content.appendChild(renderTabs());
  const day = state.days[activeDayIndex] || state.days[0];
  if(day) content.appendChild(renderDay(day));

  el('feedbackTitle').textContent = L.feedbackTitle;
  el('feedbackJump').textContent = L.feedbackJump;
  el('feedbackText').placeholder = L.feedbackPlaceholder;
  el('feedbackSubmit').textContent = L.feedbackButton;

  renderLageplan();
}

el('subtitle').textContent = STR.de.loading;

const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbzoH4-kugbWwop8jx7tuEztl9vAaZnWhHgHdtD_7NZ1IN3lOxgN0flNEH_kFcHDJiLVnA/exec';

el('feedbackSubmit').addEventListener('click', async () => {
  const L = t();
  const text = el('feedbackText').value.trim();
  if(!text){
    el('feedbackStatus').textContent = L.feedbackEmpty;
    return;
  }
  if(!confirm(L.feedbackConfirm)) return;

  el('feedbackSubmit').disabled = true;
  el('feedbackStatus').textContent = L.feedbackSending;
  try{
    await fetch(FEEDBACK_URL, {
      method: 'POST',
      body: JSON.stringify({ message: text })
    });
    el('feedbackText').value = '';
    el('feedbackStatus').textContent = L.feedbackSent;
  }catch(e){
    console.error(e);
    el('feedbackStatus').textContent = L.feedbackError;
  }
  el('feedbackSubmit').disabled = false;
});

loadAll();
</script>
</body>
