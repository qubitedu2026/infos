<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quBit — Zeitplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#1B2430;
    --paper:#FAFAF8;
    --card:#FFFFFF;
    --slate:#6B7280;
    --border:#E3E1D9;
    --rail:#C9C6BA;
    --brand:#00549F;
    --red:#B0332E;
    --amber-bg:#FBEFD9;
    --amber-fg:#8A5A16;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 4rem;}
  header{margin-bottom:1.5rem;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate);
    margin:0 0 6px;
  }
  .header-row{display:flex;align-items:stretch;gap:18px;}
  .venue-line{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);
    margin:0 0 6px;
  }
  .venue-line .venue-top{display:flex;align-items:center;gap:5px;}
  .venue-line .venue-addr{margin-left:17px;}
  .venue-line svg{flex-shrink:0;color:var(--slate);}
  .venue-line a{color:var(--slate);text-decoration:underline;}
  .venue-line a:hover{color:var(--brand);}
  .site-logo{
    height:auto;
    width:auto;
    max-width:140px;
    align-self:stretch;
    object-fit:contain;
    border-radius:10px;
    flex-shrink:0;
  }
  .header-text{display:flex;flex-direction:column;justify-content:flex-start;min-width:0;}
  .header-text .toolbar{margin-top:auto;padding-top:10px;}
  h1{font-size:26px;font-weight:600;margin:0 0 6px;line-height:1.2;}
  .subtitle{font-size:15px;color:var(--slate);margin:0;}

  .toolbar{display:flex;align-items:center;gap:10px;margin-top:1.25rem;flex-wrap:wrap;}
  .lang-switch{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;}
  .lang-switch button{
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;
    border:none;background:var(--paper);color:var(--ink);padding:7px 14px;cursor:pointer;
  }
  .lang-switch button.active{background:var(--ink);color:var(--paper);}
  .lang-switch button:hover{opacity:0.85;}

  .announcement{
    margin-top:1.25rem;
    background:var(--amber-bg);
    color:var(--amber-fg);
    border:1px solid #E8C888;
    border-radius:8px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
  }
  .announcement b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:2rem 0 1.25rem;flex-wrap:wrap;}
  .tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 14px;color:var(--slate);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500;}

  .track-columns-header{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .track-col-head{display:flex;align-items:center;gap:12px;padding:0 14px 6px;border-bottom:1px solid var(--border);}
  .track-col-head .time-gutter{min-width:88px;flex-shrink:0;}
  .track-col-head .col-label{
    flex:1;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--slate);text-align:center;
  }
  .track-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start;}
  .track-col{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .track-col .session{margin-bottom:0;}
  @media (max-width:520px){
    .track-row{grid-template-columns:1fr;}
    .track-columns-header{display:none;}
  }

  .session{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .session.changed{border-color:#D9A441;}
  .session-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .session.full .session-head{display:grid;grid-template-columns:110px 1fr 110px;gap:12px;align-items:center;}
  .session.full .time-badge{min-width:0;}
  .session.full .chevron{justify-self:center;}
  .session.no-details .session-head{cursor:default;}
  .session.full .head-top{justify-content:center;}
  .session.full .stitle{text-align:center;}
  .tag-title{
    font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;
    padding:5px 12px;border-radius:7px;display:inline-block;line-height:1.3;
  }
  .time-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);white-space:nowrap;min-width:88px;}
  .head-main{flex:1;min-width:0;}
  .head-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .head-top-stacked{flex-direction:column;align-items:flex-start;gap:5px;}
  .stitle{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;margin:0;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .track-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--border);color:var(--slate);white-space:nowrap;
  }
  .changed-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;
    background:#F6D98A;color:#5C3E07;white-space:nowrap;
  }
  .chevron{font-size:40px;color:var(--slate);transition:transform 0.15s;flex-shrink:0;line-height:1;}
  .session.open .chevron{transform:rotate(90deg);}
  .session-body{display:none;padding:0 14px 14px 100px;font-size:14px;color:var(--ink);}
  .session-body-wide{padding-left:14px;}
  .session.open .session-body{display:block;}
  .body-line{margin:4px 0;color:var(--slate);font-size:13px;}
  .body-line b{color:var(--ink);font-weight:500;}
  .abstract-text{margin-top:8px;line-height:1.6;white-space:pre-wrap;}
  .placeholder-text{color:var(--slate);font-style:italic;}
  .hinweis-box{
    background:var(--amber-bg);color:var(--amber-fg);border-radius:6px;padding:8px 10px;
    font-size:13px;margin-bottom:8px;
  }

  .poster-list{border-top:1px solid var(--border);margin-top:2px;}
  .poster-item{border-bottom:1px solid var(--border);}
  .poster-item-head{
    display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;
  }
  .poster-item-flat .poster-item-head{cursor:default;}
  .poster-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .poster-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;line-height:1.35;}
  .poster-author{font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--slate);}
  .poster-chevron{font-size:18px;color:var(--slate);flex-shrink:0;transition:transform 0.15s;}
  .poster-item.open .poster-chevron{transform:rotate(90deg);}
  .poster-item-body{display:none;padding:0 0 12px;}
  .poster-item.open .poster-item-body{display:block;}
  .poster-item-body .abstract-text{margin-top:0;font-size:13px;}

  .workshop-list{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .workshop-group-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--slate);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .workshop-item{margin-bottom:12px;}
  .workshop-item:last-child{margin-bottom:0;}
  .workshop-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;margin:0 0 2px;line-height:1.35;}
  .workshop-institution{font-size:12px;color:var(--slate);margin:0;}
  @media (max-width:520px){
    .workshop-list{grid-template-columns:1fr;gap:16px;}
  }

  .lageplan-section{margin-top:2.5rem;}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate);margin:0 0 10px;}
  .lageplan-frame{
    width:100%;height:480px;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  .lageplan-frame iframe{width:100%;height:100%;border:none;}
  .lageplan-caption{font-size:12px;color:var(--slate);margin-top:6px;}

  .footer-note{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);font-size:12px;color:var(--slate);}
  .empty{padding:2rem 0;color:var(--slate);font-size:14px;}
  .state-msg{padding:3rem 0;text-align:center;color:var(--slate);font-size:14px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>

function driveFileId(link){
  if(!link) return null;
  let m = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  m = link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function driveEmbedUrl(link){
  if(link && link.startsWith('data:')) return null;
  const id = driveFileId(link);
  if(!id) return null;
  return `https://drive.google.com/file/d/${id}/preview`;
}

function driveImageUrl(link){
  if(link && link.startsWith('data:')) return link;
  const id = driveFileId(link);
  if(!id) return null;
  return `https://drive.google.com/uc?export=view&id=${id}`;
}

    mockS('both','14:30','14:45','pause','Pause','Break'),
    mockS('A','14:45','15:15','vortrag','Quantenobjekte interaktiv erkunden: IBEs zu Einzelphotonenexperimenten','','Marco Seiter','','Realexperimente der Quantenphysik sind für Unterricht, Schülerlabore und Hochschullehre didaktisch wertvoll, aber oft nur eingeschränkt verfügbar: Die Aufbauten sind teuer, justageintensiv, empfindlich und zeitlich nicht immer flexibel einsetzbar. Interaktive Bildschirmexperimente (IBEs) können diese Lücke schließen, indem sie reale Experimentierumgebungen digital zugänglich machen und Beobachtung, Variation und Interpretation systematisch unterstützen. An der Ruhr-Universität Bochum wurden IBEs auf Basis realer Aufbauten mit dem Quantenkoffer von QuTools entwickelt. Thematisch adressieren sie Einzelphotonenexperimente zu Strahlteiler, Polarisation, Interferenz, Welcher-Weg-Information, Quantenradierer und Verschränkung. Im Vortrag stellen wir Motivation, Entwicklungsstand und mögliche Einsatzszenarien vor. Diskutiert werden die Möglichkeiten und Einschränkungen der IBEs gegenüber dem Realexperimenten und die Frage, inwiefern die IBEs als Ersatz einen phänomenorientierten Zugang zu Quantenobjekten ermöglichen, der die Grenze zwischen experimenteller Beobachtung, fachlicher Schlussfolgerung und deutender Interpretation explizit thematisiert.','','Marco Seiter, Josefin Metje, Heiko Krabbe'),
    mockS('B','14:45','15:15','vortrag','','KVANT21 - Making quantum physics part of the Danish high school curriculum','Jeppe Willads Petersen','','The KVANT21 project is a four year programme in which teaching materials and didactics are developed to be incorporated as part of the Danish national curriculum for high school physics. Every three years a section of the curriculum called physics in the 21st century changes. Starting in 2027 quantum physics with a focus on applications in quantum computing, sensing and communication is expected to take over. The short presentation will demonstrate some of the elements in preparing for this new section of the curriculum and the prospect of bringing some of the content into the lower levels as well.','',''),
    mockS('A','15:15','15:45','vortrag','Tertium non datur? Zwischen Analogie- und Realexperiment: Messdatenreplay zur Reproduktion experimenteller Handlungslogik','','Fabian Bernstein','','Viele Einzelphotonenexperimente markieren zentrale Einsichten der Quantenoptik, entfalten als Realexperiment in Schule, Schülerlabor und Outreach jedoch nur begrenzt didaktisches Potenzial. Dies liegt einerseits an den Anforderungen ihrer praktischen Umsetzung in Bildungssettings, andererseits an prinzipbedingten Grenzen der Interaktion zwischen Lernenden und Experiment: Einzelphotonen, Verschränkung oder Polarisationszustände sind stets nur vermittelt zugänglich. Daraus ergibt sich ein didaktischer Spielraum für hybride Formate, die weder reine Analogieexperimente noch vollständige Einzelphotonen-Realexperimente sind. Der Beitrag diskutiert Messdatenreplay als Methode, um Handlungs- und Beobachtungslogiken von Einzelphotonenexperimenten zu reproduzieren. An einem konkreten Beispiel wird gezeigt, wie ein real aufgebautes Analogieexperiment die experimentelle Handlungslogik eines quantenoptischen Experiments nachvollziehbar macht. Anschließend werden vorab aufgezeichnete, authentische Messdaten so eingebunden, dass sichtbar wird, welche diskreten Messereignisse in einer entsprechenden Einzelphotonenmessung auftreten würden. Messdatenreplay ersetzt damit weder Realexperiment noch Simulation, sondern bezieht gegenständliches Analogieexperiment und authentische Messdaten didaktisch aufeinander.','',''),
    mockS('B','15:15','15:45','vortrag','','Optimizing the return on investment of multi-facet education of the masses about quantum & high-tech innovation','Michiel Thijssen','','The Quantum Rules! lab (est. 2019) at Leiden University is the oldest quantum education lab in the Netherlands. Each year, we receive over 600 secondary school students from 30+ schools in the vicinity and beyond, as well as non-science university BSc., university of applied science MSc. and high-tech vocational school students. To diversify beyond these groups, we\'re morphing from uni-directional outreach and education efforts towards involving citizens in our (quantum) science and teaching the professionals (like teachers) so they can teach others. I\'ll present the ways we are doing this, including a Quantum Rules! Pro lab, a Quantum Games Lab and the Quantum Safari. All aimed at increasing quantum awareness, stimulate citizen science, support development of quantum / AI education, research and build the QDNL Leiden hub.','',''),
    mockS('A','15:45','16:15','vortrag','Vergleich haptischer mit Simulationsexperimenten beim Erlernen des BB84-Protokolls','','Jannis König','','Das BB84-Protokoll für einen sicheren Schlüsselaustausch im Rahmen der Quantenkryptographie stößt bei Schülerinnen und Schülern auf großes Interesse. Dabei kommen in der Praxis oft entweder haptische Analogexperimente (die mit gewöhnlichem Licht arbeiten und die daher den eigentlichen Quanteneffekt nur als Analogie wiedergeben können) oder Computersimulationen (wo der Austausch einzelner Photonen simuliert wird) zum Einsatz. Ziel meiner Studie ist der Vergleich des Nutzens eines haptischen Analogieexperiments aus dem der Öffentlichkeitsarbeit gewidmeten Outreach-Projekt "Quanten auf Reisen – eine interaktive Wanderausstellung (Q-Bus)" mit jenem eines Simulationsexperiments für das konzeptionelle Verständnis des BB84-Protokolls sowie im Hinblick auf das Interesse von Schülern der Sekundarstufe II. Dazu sollen diese an Gymnasien oder Optikerschulen entweder mit einem haptischen Versuchsaufbau oder einem Simulationsexperiment arbeiten und gemeinsam einen zufälligen Schlüssel generieren. Die Datenerhebung erfolgt in einem Vorher-Nachher-Design mit einer zusätzlichen Folgeerhebung.','',''),
    mockS('B','15:45','16:15','vortrag','','Societal aspects of quantum lab visits by high school students','Henk Buisman','','In the past I set up the first quantum lab in the Netherlands, called QuantumRules. I had time to reflect on my experiences, and although my current business is building Qlabs and hardware, I would like to talk about the societal aspects of visits to quantum labs by high school students. Not all visitors will pursue a career in quantum. This is an important group for which we have the opportunity to show what quantum (or broader physics) can, and also what it cannot, do.','',''),
    mockS('both','16:15','16:45','pause','Pause','Break'),
    mockS('A','16:45','17:15','vortrag','Lernlabor Quantumcomputing: Vom Educational Game zum Grover','Quantum School Lab: from educational Game to Grover','Mirte van der Eyden','','Quantencomputing gewinnt zunehmend an wissenschaftlicher und gesellschaftlicher Bedeutung, doch die Vermittlung seiner zugrunde liegenden Konzepte an Schüler:innen der Sekundarstufe stellt weiterhin eine erhebliche didaktische Herausforderung dar. An der Universität Innsbruck haben wir ein Lernlabor für Schüler*innen der Sekundarstufe im Alter von 15 bis 18 Jahren entwickelt, das grundlegende Quantenkonzepte mit Quantentechnologien verbindet. In einer Abfolge von Aktivitäten erarbeiten die Schüler*innen zentrale Konzepte der Quantenphysik, um schließlich den Grover-Algorithmus auf einem realen optischen Zwei-Qubit-Quantencomputer auszuführen. Dabei folgt der Workshop einer strukturierten Lernsequenz, die ein educational game, optische Experimente, Einzelphotonen-Simulationen sowie leitende Diskussions- und Reflexionsfragen kombiniert, um das Verständnis zu fördern. Behandelt werden unter anderem Superposition, probabilistische Messergebnisse, komplementäre Basen, Einzelphotoneninterferenz und Pfadinformation. Zur Evaluation des Workshops wurden Prä- und Posttests zum Verständnis der Schüler:innen sowie zu ihren Lernerfahrungen mit insgesamt N = 369 Teilnehmenden durchgeführt. Im Vortrag stellen wir die didaktischen Gestaltungsentscheidungen, die praktische Umsetzung des Workshops sowie erste Evaluationsergebnisse vor.','','','Quantum computing is rapidly gaining scientific and societal relevance, yet introducing its underlying concepts to secondary school students remains a significant educational challenge. At the University of Innsbruck, we developed a Quantum School Lab for students aged 15–18 that aims to connect fundamental quantum concepts with contemporary quantum technologies. Through a sequence of activities, students explore quantum concepts to finally run the Grover algorithm on a real two-qubit optical quantum computer. We thereby follow a structured sequence of activities, from embodied games to optical experiments and single-photon simulations to guiding questions to promote understanding. The workshop covers superposition, probabilistic measurement outcomes, complementary bases, single-photon interference and path information. To evaluate the workshop, we collected pre- and post-test data on students\' understanding and learning experiences from N=369 students. In the talk we discuss the design choices, practical implementation, and first evaluation results.'),
    mockS('B','16:45','17:15','vortrag','Entwicklung eines Kursformats zu NV-Zentren und Einzelphotonen','Development of a Teaching Format on NV Centers, Single Photons and Quantum Sensing','Tim Sedlaczek','','Im Vortrag wird die Entwicklung eines online Kurses zur modernen Quantenphysik vorgestellt. Ausgangspunkt ist die Frage, wie aktuelle Forschung zu NV-Zentren im Diamant für Schüler didaktisch zugänglich gemacht werden kann. Der Kurs verbindet Fluoreszenz, Einzelphotonenemission und Quantensensorik mit realen Forschungsdaten des HZDR. Als Vergleichsgruppe wird der gleiche Kurs in Schulen vor Ort gehalten, um der Forschungsfrage nachzugehen, ob ein online Kurs ähnlich gut Authentizität und Interesse fördern kann, wie ein vor-Ort-Kurs. Das Projekt befindet sich in der Pilotierungsphase.','','','This talk presents the development of a teaching format on modern quantum physics for upper secondary students. Using NV centers in diamond as a contextual anchor, the course connects fluorescence, single-photon emission, photon statistics and quantum sensing. Authentic research elements, including experimental images and real data from the HZDR context, are used to make current research accessible. The format will be implemented both as a live online course from the school lab and as an in-person course at schools. The accompanying study investigates whether the online format can foster perceived authenticity and interest comparably to the in-person format. The project is currently in the pilot phase.'),
    mockS('A','17:15','17:45','vortrag','','A student laboratory on quantum entanglement','Elias Oehler','','Quantum entanglement, as a fundamental feature of quantum physics, has long been relevant only to university-level education. With the incorporation of the quantum physical worldview – regarding reality, locality, causality, and determinism – into the educational standards of the Conference of Ministers of Education in Germany for physics, entanglement has also become relevant for teaching quantum physics in schools. In our presentation, we will introduce a student laboratory on quantum entanglement that is currently being developed by our research group and in which experiments with correlated photons can be modelled, investigated and discussed. The laboratory also includes a student-friendly exploration of the CHSH inequality, as well as analog experiments demonstrating violations of this inequality using classical light.','',''),
    mockS('B','17:15','17:45','vortrag','','Phosphorescence half-life classroom experiment','Silvester Infante Ferreira','','The phosphorescence workshop at TU Delft introduces students to luminescent materials that emit light after excitation. Phosphorescence occurs when electrons are trapped and release energy slowly over time. Students excite samples with light, then measure the decay of emitted intensity to determine the half-life. The setup uses an Arduino-based detection system combined with an interactive webpage to record and visualize the signal in real time. This hands-on approach connects everyday glow-in-the-dark effects to quantum physics, helping students (15-18y) understand energy levels, electron transitions, and experimental data analysis.','',''),

  mockDay('Dienstag', 'Tuesday', [
    mockS('both','09:00','09:45','plenum','Plenarvortrag 2 (tba)','Plenary Talk 2 (tba)','','Track A Hörsaal (H09)'),
    mockS('A','09:45','10:15','vortrag','Entwicklung eines Experiments zur Messung der g2-Funktion einer gebunchten Lichtquelle','','Kim Kappl','','Die Korrelationsfunktion zweiter Ordnung (g2-Funktion) erlaubt eine Klassifikation von Lichtquellen in kohärente, gebunchte und antigebunchte Quellen. Während kohärente Quellen experimentell einfach zugänglich sind (beispielsweise in Form eines abgeschwächten Lasers) und antigebunchte Quellen (etwa Quantenpunkte, Stickstoff-Fehlstellen in Diamant oder SPDC-basierte angekündigte Einzelphotonenquellen) bereits verbreitet in universitären Fortgeschrittenenpraktika eingesetzt werden, fehlt zur Vervollständigung der Triade bislang ein praktikables Experiment zur Messung der g2-Funktion einer echten gebunchten Lichtquelle. Die zentrale experimentelle Herausforderung besteht in der extrem kurzen Kohärenzzeit solcher Quellen, da diese die Breite des charakteristischen Bunching-Peaks bestimmt. In diesem Regime ist die Instrument Response des Messsystems von entscheidender Bedeutung für die Sichtbarmachung dieses Peaks. Wir präsentieren ein Experiment zur Messung der g2-Funktion einer Quecksilber-Dampflampe, das an bereits bestehende Einzelphotonen-Experimente anschlussfähig ist.','',''),
    mockS('B','09:45','10:15','vortrag','Zwischen Physik und Informatik: Warum wir den Einstieg in Quantencomputing neu denken sollten','','Adrianna Alexander','','Quantencomputing wird an Hochschulen meist physikorientiert vermittelt, wobei lineare Algebra und physikalische Intuition im Mittelpunkt stehen. Für Informatik-Studierende stellt dieser Ansatz häufig eine erhebliche Einstiegshürde dar, da ihr Zugang zu neuen Themen stärker von Algorithmen, Implementierung und experimenteller Erprobung geprägt ist. Vorgestellt wird ein alternativer Lehransatz, der informatisches Denken, Quantenprogrammiermodelle und frühe praktische Erfahrungen in den Vordergrund stellt. Mathematische Konzepte werden schrittweise als Hilfsmittel zum Verständnis eingeführt, nicht als Einstiegsvoraussetzung. So lassen sich Zugangshürden reduzieren, ohne wissenschaftliche Präzision einzubüßen. Niedrigere Einstiegshürden fördern Partizipation und erweitern das Innovationspotenzial des Fachgebiets.','',''),
    mockS('A','10:15','10:45','vortrag','Förderung von Konzeptverständnis in Polarisationsexperimenten mit AR','','Alexander Schuster','','In dieser Studie wurde untersucht, ob die Kombination von realen und digitalen Repräsentationen das Verständnis von Lichtpolarisation bei Schülerinnen und Schülern fördern kann. Basierend auf bisherigen Erkenntnissen zu den ergänzenden Vorteilen von hands-on und virtuellen Experimenten wurde ein reales Polarisationsexperiment durch modellhafte Augmented-Reality-Visualisierungen erweitert. In einer quantitativen Pre-Post-Studie mit rund 200 Schülerinnen und Schülern der Sekundarstufe II wurden vier verschiedene Bedingungen verglichen: (1) ein rein reales Experiment (RE), (2) ein reales Experiment mit separaten Visualisierungen (RE+VIR-sep), (3) ein reales Experiment mit integrierten Augmented-Reality-Visualisierungen (RE+VIR-aug) und (4) ein vollständig virtuelles Experiment (VIR). Erste Ergebnisse zeigen, dass alle Gruppen ihr Konzeptverständnis durch die Intervention signifikant verbessern konnten, wobei keine signifikanten Haupteffekte zwischen den Gruppen beobachtet werden konnten. Weitere Analysen werden auf der QubitEdu präsentiert.','',''),
    mockS('B','10:15','10:45','vortrag','Fit für QT: Individualisierte Quanten-Bildung für Unternehmen','Fit for QT: Individualized Quantum Training for Industry','Franziska Greinert','','Um Quantentechnologien (QT) in die breite Anwendung zu bringen, müssen auch (potenzielle) End-Nutzer-Unternehmen auf QT vorbereitet werden. Vorgestellt werden die Strategie zur Erstansprache von Unternehmen sowie das Konzept zur individuellen Bedarfsanalyse – basierend auf dem European Competence Framework for Quantum Technologies – mit Ableitung einer individualisierten Bildungsstrategie. Zudem wird ein Ausblick auf den in diesem Zusammenhang entstehenden "Katalog" bestehender Bildungsangebote gegeben.','','','To accelerate the adoption of quantum technologies (QT), potential end-user companies need support in building quantum awareness and capabilities. This contribution presents an approach for engaging with companies at an early stage, including a structured analysis of their specific needs and readiness for QT. The assessment is based on the European Competence Framework for Quantum Technologies and serves as the foundation for developing tailored training strategies. Depending on the identified needs, companies can be guided towards suitable formats selected from a catalogue of existing education and training offers.'),

  mockDay('Mittwoch', 'Wednesday', [
    mockS('both','09:30','10:15','plenum','Plenarvortrag 3 (tba)','Plenary Talk 3 (tba)','','Track A Hörsaal (H09)'),
    mockS('A','10:15','10:45','vortrag','','','Christina Lüders','','','',''),
    mockS('B','10:15','10:45','vortrag','','The Quantum Teaching Project: Lesson Materials on Quantum Computing','Rutger Ockhorst','','We present three freely available lesson modules on quantum computing that were developed and tested by an international team of researchers from Denmark, Austria and The Netherlands. We will discuss the development cycle and share our experiences testing the materials with a group of around 30 international students. The modules cover topics such as entanglement, superposition and the physical implementation of qubits. The talk will include a demonstration of some of the in-class activities and experiments featured in the material.','','Rutger Ockhorst, Myrte van der Eyden'),
    mockS('A','10:45','11:15','vortrag','Erfassung deklarativen Wissens über Verschränkung, Polarisation und Quantenmessung: Entwicklung und Validierung eines Konzepttests','','Josefi Metje','','Für den Vergleich des Wissenszuwachses bei Realexperimenten und interaktiven Bildschirmexperimenten zu Polarisation, Messung und Verschränkung wurde ein Testinstrument für Schülerinnen und Schüler der gymnasialen Oberstufe sowie Physikstudierende entwickelt und validiert. Ausgehend von 18 Single-Choice-Items wurde das Instrument im Rahmen eines iterativen Entwicklungsprozesses anhand von Qualitätsanalysen auf 12 Items reduziert. Die Evaluation umfasste Distraktorenanalysen sowie Auswertungen mithilfe der Item-Response-Theorie auf Basis von Daten von mehr als 200 Teilnehmenden aus Schule und Hochschule. Ergänzend wurden Think-Aloud-Studien mit Lernenden unterschiedlicher Ausbildungsstufen sowie Expertinnen- und Expertenfeedback herangezogen. Der Vortrag stellt die Entwicklung des Instruments sowie Ergebnisse der Pilotierung und Validierung vor.','',''),
    mockS('B','10:45','11:15','vortrag','','Teaching Quantum Mechanics and Computing with AI','Taha Selim','','Quantum mechanics and computing are inherently complex, often presenting abstract concepts that are difficult for students to visualize and internalize. The integration of artificial intelligence offers a transformative opportunity to create interactive, engaging, and personalized learning experiences—particularly for bachelor and master students in applied sciences. This is especially vital for students transitioning from diverse academic backgrounds into specialized roles as quantum software or hardware engineers. By leveraging AI-generated instructional videos, interactive simulations, and AI-assisted problem-solving exercises, we can demystify complex theoretical concepts and advanced mathematical techniques. In this presentation, I propose a structured pedagogical approach to teaching quantum mechanics and computing through AI-enhanced workflows. I will demonstrate a practical, one-week course module designed for a university setting, emphasizing hands-on learning and real-world application. Furthermore, I will critically compare this AI-integrated framework against traditional teaching methods, highlighting the measurable benefits for student engagement and comprehension. Ultimately, this approach aims to provide students with a deeper conceptual mastery of quantum systems while equipping them with the essential competencies required to excel in the rapidly evolving field of quantum technology.','',''),
    mockS('both','11:15','11:30','pause','Pause','Break'),
    mockS('A','11:30','12:00','vortrag','Qubit Repräsentationen im Vergleich: Die Bloch-Kugel erhöht die Aufgabeneffizienz','','Lidna Qerimi','','Visuell-graphische Repräsentationen können eine zentrale Rolle beim Verständnis abstrakter Quantenkonzepte wie Zuständen, Superposition oder Messung spielen – insbesondere für Lernende mit geringem Vorwissen. Aufbauend auf unserer Expert:innenstudie (N = 21), in der vier Qubit-Repräsentationen anhand unseres Kategoriensystems bewertet wurden, untersuchten wir in einer Folgestudie mit 149 Schüler:innen die Blochkugel und die Quantum Beads. Verglichen wurden Lernerfolg, Effizienz bei anwendungsbezogenen Aufgaben (z. B. zu Amplitude, Quantenmessung oder Superposition), kognitive Belastung und Behaltensleistung nach ein bis zwei Wochen (mittels Follow-up-Tests). Im Lernerfolg, in der kognitiven Belastung und in der (mittelfristigen) Behaltensleistung zeigten sich keine signifikanten Gruppenunterschiede. Lernende bearbeiteten anwendungsbezogene Aufgaben mit der Blochkugel jedoch signifikant effizienter, gemessen am Verhältnis von Richtigkeit und Bearbeitungszeit. Die Ergebnisse bestätigen Teile der Expert:innenbewertung und zeigen, dass unterschiedlich gestaltete Qubit-Repräsentationen kognitive Prozesse bei der Bearbeitung von Aufgaben zu Amplitude, Superposition, Quantenmessung und Quantenzustand unterschiedlich beeinflussen können.','','Linda Qerimi, Sarah Malone, Eva Rexigel, Jochen Kuhn, Stefan Küchemann'),
    mockS('B','11:30','12:00','vortrag','','Quantum Optics at Deutsches Optisches Museum Jena','Dustin-Philipp Preissler','','The Lichtlabor will be a newly established platform for school student labs and physics teacher\'s education at Deutsches Optisches Museum Jena from 2028 on. We developed two experimental kits for Raman spectroscopy and Michelson interferometry. They provide a lot of possible experiments including Raman scattering, sample characterization, ghost imaging analogy and Fourier transform spectroscopy. Every kit consists of optical components, a detector (spectrometer or camera), laptop with software, instructions and task sheets. The presentation gives an overview about how these experimental kits could be used by pupils and prospective physics teachers to explore quantum physics in an extracurricular environment.','','Dustin-Philipp Preissler, Oskar Habla, Timo Mappes, Elias Oehler, Holger Cartarius'),
    mockS('A','12:00','12:30','vortrag','Schülerakzeptanz eines interaktiven Applets zur klassischen Polarisation','','Jonas Bley','','Polarisation wurde als geeignetes Einstiegsthema in das Qubit identifiziert. Es liegt nahe, zwecks eines kohärenten Unterrichtsverlaufs die klassische Polarisation vorzuschalten. In diesem Kontext stellt sich die Frage, ob die Poincaré-Kugel (das klassische Äquivalent zur Bloch-Kugel zur Visualisierung des einzelnen Qubits) hier nur zusätzlichen kognitiven Anspruch fordert, oder nebst dem Repräsentieren eines eigenen fachlichen Lernziels tatsächlich zur Unterstützung des Lernens geeignet ist. Teilnehmende der Quantenakademie 2026 werden in zwei Gruppen eingeteilt (mit und ohne Poincaré-Kugel) und mit einem neuen, interaktiven Applet in die Polarisation, und wie man sie mit Wellenplatten und Polarisatoren kontrolliert verändern kann, eingeführt. In diesem Vortrag werden das Applet sowie die ersten Ergebnisse der erweiterten Technologieakzeptanzbefragung und Fragen zur kognitiven Belastung präsentiert. Die Ergebnisse werden bezüglich der Rolle von interaktiven Visualisierungen im Zusammenhang mit Modellvorstellungen in der Quantenphysik-Lehre diskutiert. Auf Basis der Diskussion werden Hypothesen für zukünftige Forschung aufgestellt.','',''),
    mockS('B','12:00','12:30','vortrag','','Development of a user-friendly software for performing quantum chemical calculations','Dennis Lafeld','','Quantum chemical methods are a fundamental part of modern chemistry and condensed matter physics research, as they enable the prediction of molecular properties such as stability, electron distribution and excitation energies. They are especially useful for studying compounds that are time-consuming and expensive to synthesize. In an educational context, quantum chemical calculations can also be applied to investigate compounds that are of interest in current research but are prohibited to be handled experimentally, such as certain azobenzene derivates. However, the software used to perform such calculations is often unintuitive and overloaded with options that are unnecessary for achieving the intended learning goals. In this presentation, we will introduce a user-friendly software currently under development within the research training group "PhInt". This software aims at making quantum chemistry more applicable in educational settings. Based on this tool, a student laboratory course will be developed to teach the fundamentals and applications of quantum chemical methods.','','Dennis Lafeld, Holger Cartarius'),
    mockS('both','12:30','13:00','abschluss','Abschluss','Closing')
  ])

const MOCK_POSTERS = [
  mockPoster('Simulationen von Quantenexperimenten im Web und erste Einblicke in das Interesse','','Ismet N. Dogan','Die Vermittlung von Quantenphysik stellt aufgrund ihrer Abstraktheit eine didaktische Herausforderung dar. Interaktive Web-Simulationen bieten hier einen vielversprechenden Ansatz, um einerseits komplexe Phänomene greifbar zu machen und andererseits Experimente unkompliziert zur Verfügung zu stellen sowie Lernenden die Möglichkeit zu geben frei zu agieren. Das Poster präsentiert die neuesten Simulationen einer webbasierten Plattform (MILQ), in der quantenphysikalische Experimente – wie bspw. das Mach-Zehnder Interferometer oder der Doppelspaltversuch – digital abgebildet und für Lernende sowie Interessierte zugänglich gemacht werden. Neben der Vorstellung der Simulationen werden erste Einblicke einer begleitenden Pilotumfrage vorgestellt. Im Fokus stand dabei das Interesse, aufgeteilt in kognitiver und emotionaler Komponente des Interesses.',''),
  mockPoster('Photonik als Enabling Technology für Quantentechnologien – Entwicklung eines Schülerlabors','','Laureen Dänzer','Photonische Technologien zählen zu den zentralen Schlüsseltechnologien moderner Forschung, Industrie und Quantentechnologien. Im Kompetenzframework für Quantentechnologien von Müller und Greinert werden sie als Enabling Technologies hervorgehoben und bilden eine wesentliche Grundlage für Anwendungen wie Quantenkommunikation, Quantensensorik und Quantencomputing. Gleichzeitig bieten photonische Experimente einen anschaulichen und experimentell zugänglichen Einstieg in diese Zukunftstechnologien. Jedoch kommen die Optik und die photonischen Technologien im Schulunterricht oftmals zu kurz. Um diese Brücke zu schlagen, wird im Rahmen eines Schülerlabors ein modulares Experimentierkonzept entwickelt, das Schülerinnen und Schülern der gymnasialen Oberstufe grundlegende Konzepte und Anwendungen der Photonik vermittelt. Die Themen reichen von Lichtquellen, Detektoren und Polarisation über Interferenz bis hin zu modernen Anwendungen wie Einzelphotonenquellen, Photonik-Chips oder optischen Pinzetten. Es wird das didaktische Gesamtkonzept, erste realisierte Experimente sowie zukünftige Erweiterungsideen zur Nachwuchsförderung im Bereich der Photonik und Quantentechnologien vorgestellt.',''),
  mockPoster('Versuchsangebote für Schulen im Rahmen von MasterClass-Workshops','','Tim Overwin','MasterClass-Workshops bieten Schulklassen aus Braunschweig und Umgebung seit 2019 die Möglichkeit, einen Einblick in aktuelle physikalische Versuche und Forschung zu bekommen. Dabei sollen Interesse, Motivation und das Verständnis von – meist quantenmechanischen – Phänomenen gefördert werden. Die Workshops werden mit höheren Klassenstufen von Gymnasien oder Gesamtschulen entweder mobil in den Schulen oder in der TU durchgeführt. Aktuelle Versuche beschäftigen sich unter anderem mit Quantenkryptographie, -computing und -sensorik.',''),
  mockPoster('Evaluation eines interaktiven NV-Zentrum-Exponats im phaeno: Besucherverständnis und Interesse','','Azadeh Ghanbari','Im Rahmen der Entwicklung eines interaktiven Exponats zum NV-Zentrum im Science Center phaeno wurde eine kurze Besucherevaluation durchgeführt. Ziel war es, erste Rückmeldungen zum Verständnis der vermittelten Inhalte, zum Interesse der Besucherinnen und Besucher sowie zur Wahrnehmung des Exponats zu erhalten. Hierfür wurde ein kurzer Fragebogen eingesetzt, der direkt nach der Interaktion mit dem Exponat ausgefüllt werden konnte. Die Ergebnisse liefern Hinweise darauf, wie das Exponat von den Besucherinnen und Besuchern angenommen wird und welche Aspekte bei der Weiterentwicklung berücksichtigt werden können.',''),
  mockPoster('','Quantum Education Initiatives at the Math Department','Johanne de Leon','At the Villum Centre for the Mathematics of Quantum Theory (QMATH) we engage in a range of quantum education activities, spanning high school, university, and continuing education. Here, we describe Lifelong Education in Quantum Science and Quantum Applications of Linear Algebra: Educational Video Series, projects that aim to increase quantum awareness, spark early interest, strengthen pathways into quantum science, support the master\'s program in Quantum Information Science (QIS), and offer continuing education for high school teachers. High school workshops range from introductory projects on qubits and quantum algorithms to projects with a stronger emphasis on deductive reasoning, revolving around quantum gates, entanglement, and unitary matrices. First-year BSc mathematics students are offered quantum mathematics projects, and we deliver extra-curricular activities for MSc students such as brush-up materials and industry matchmaking events.',''),
  mockPoster('','Master Applied Quantum Technology','Marijn Versteegh','Four universities of applied sciences (Amsterdam, The Hague, Fontys (Eindhoven) and Saxion (Enschede)) have together constructed a master programme on applied quantum technology. The programme was designed with input from the quantum industry. The first group of students started in 2025, the second group will start in 2026. We welcome students from various engineering bachelor programmes. In the programme, students acquire knowledge of quantum technology, as well as technical skills and interdisciplinary collaboration skills, which they will need when working as a quantum engineer. The programme focuses on enabling technologies such as photonics, electronics, nanofabrication and software engineering.',''),
  mockPoster('','Transportable Magneto-Optical Trap of Strontium for Educational Outreach','Thorsten Groh','Cold-atom experiments provide a compelling way to communicate the principles of modern quantum technologies. We present a transportable strontium magneto-optical trap (MOT) developed for educational outreach and as a physics Master\'s laboratory experiment. The compact, low-power, battery-operated apparatus enables reliable operation both inside and outside the laboratory. In the laboratory course, students gain hands-on experience with laser cooling, atomic spectroscopy, and precision measurements, including isotope shifts and hyperfine structure. The bright fluorescence of laser-cooled strontium on the 461 nm transition produces an atom cloud visible to the naked eye, enabling demonstrations of laser cooling and atom trapping for audiences ranging from university students to the general public.',''),
  mockPoster('','“I need some structure and support”: Teacher Competence and Perspectives on the Quantum Dice Analogy','Kirsten Stadermann','Demonstration materials such as the Quantum Dice may support learning about quantum physics, but their effectiveness depends on how teachers interpret and implement the analogy. This study, conducted in U.S. teacher development workshops, investigates teachers\' emerging pedagogical content knowledge as reflected in their understanding of the analogy. Teachers completed a mapping task comparing the Quantum Dice to an authentic quantum system and identifying its limits, followed by a questionnaire in which they designed lesson activities. Responses show variation in the accuracy and explicitness of teachers\' mappings and tendencies toward either modelling-oriented or demonstration-focused uses of the analogy. Preliminary findings suggest that teachers need structured opportunities to reflect on the analogy itself, combined with concrete activity examples, for analogies to be used effectively in the classroom.','Bart Folkers, Carsten Albert, Angela M. Kelly, Alexander Brinkman, Kirsten Stadermann'),
  mockPoster('','Quantum Cryptography with Q-Beads – a simple approach','Silke Stähler-Schöpf','In the student lab "PhotonLab", we use the Q-Beads visualization to introduce qubits. In ThorLabs\' analog experiment on quantum cryptography, two different polarization states are used in each of two different bases to encode the bit values 0 and 1. We illustrate this using the four different positions of the Q-bead in space. A qubit sent by Alice is measured by Bob, who selects his measurement basis by choosing a direction from which to view the Q-Bead. This explains the measurement process and allows to discuss why an unknown qubit cannot be copied (no cloning theorem).',''),
  mockPoster('','The Role of the Physical Context for Understanding the Mathematical Formalism of Quantum Physical Two-State Systems','Moritz Förster','As fundamental principles of quantum physics are inherently described by mathematical structures, taking mathematical representations into account when teaching quantum physics in schools is highly discussed in quantum education research. Especially approaches via exemplary two-state systems are of interest, as their mathematical description is comparatively simple. While there is research on understanding mathematics within the context of two-state systems, there is a lack of literature investigating the role of the specific quantum physical system for accepting and understanding the mathematical formalism. In the past, a study was conducted analysing pre-service teachers\' assessment and learning difficulties regarding a reduced mathematical formalism in the context of photon polarisation. In a follow-up study, the same formalism was employed within the context of spin-1/2 as another two-state system. The poster discusses the role of the physical context in the acceptance and understanding of the formalism and gives first insights into the results of an interview study.',''),
  mockPoster('','Navigating Quantum Education at Uni-level: Didactic Pathways and a Roadmap for Textbook Selection','Yajie Liang','Quantum mechanics (QM) textbooks both shape classroom instruction and reflect the pedagogical strategies of the lecturers and researchers who write them. This study analyzes the didactic structures of university-level QM textbooks across nations and eras by mapping the chapter-level placement of mathematical formalisms, illustrative physical systems, foundations and interpretations. The comparison reveals distinct pedagogical priorities: what is treated as fundamental, what is introduced as accessible, how much is connected to modern developments, and how conceptual understanding is balanced against formal competence. It also identifies a shift from traditional "wave-first" and "spin-first" trajectories toward more diverse approaches, including concept-oriented and synthetic presentations that connect formalism, experiment, and applications. Based on these differences, we propose a roadmap for students, lecturers, curriculum designers, and independent learners seeking textbooks aligned with their backgrounds, goals, and visions of quantum education.',''),
  mockPoster('NV-Zentren-Magnetometer im Schulunterricht: Drei Anwendungsszenarien','','Simon Koppenhöfer','Aufbauend auf einem etablierten didaktischen Konzept zum NV-Zentren-Magnetometer (ODMR-Verfahren) stellen wir drei neue, anwendungsbezogene Lernmodule vor. Über interaktive Branching-Szenarien (H5P) mit angeschlossenem Experimentierkit erfahren Lernende, wie dieselbe kostengünstige Sensortechnologie in unterschiedlichen realen Kontexten eingesetzt wird. Ausgehend von Krankheitsbildern erarbeiten Lernende im ersten Modul, warum Nervenaktivität über ihr Magnetfeld statt direkt elektrisch gemessen wird, und ordnen Sensortypen (Hall, SQUID, NV) nach Genauigkeit und Praxistauglichkeit ein. Das zweite Lernmodul überträgt das Prinzip auf die Elektronikprüfung. An einer präparierten Leiterbahn mit Defekt lokalisieren Lernende Stromverlauf und Risse magnetisch und lernen Anwendungen wie Qualitätskontrolle und Counterfeit-Detection kennen. Das dritte Modul nutzt den Kontext Kompass und GPS-Lokalisierungstechnologien, um richtungsempfindliche Magnetfeldmessungen im interaktiven Lernmodul und im didaktischen Experiment zu thematisieren. Das Poster präsentiert Aufbau und erste Erprobungserfahrungen dieser Erweiterung.',''),
  mockPoster('','Quantitative experiments on interferometry in the student laboratory','Oskar Habla','Interferometers serve as an excellent analogy for quantum technologies. Until now, students in our student laboratory have only been able to conduct qualitative experiments. In this poster, however, we will show how students can use simple, inexpensive interferometer setups to determine quantities such as the laser wavelength, the mode spacing, and the transmittance of neutral-density filters with just a single measurement.',''),
  mockPoster('Quantum Education@HdM','','Nadine Weber','Mit dem Transformationsprojekt "Quantum Education@HdM" bauen wir innerhalb der Hochschule der Medien Stuttgart einen Forschungsschwerpunkt über Quantum Education auf, in welchem wir die Zielgruppe von Studierenden der Hochschulen für Angewandte Wissenschaften (HAW) in den didaktischen Fokus stellen, die keinen traditionellen Physik-, Mathematik- oder Ingenieurs-Studienhintergrund haben. Mit unserem interdisziplinären Background – als Medienhochschule über Studiengangs- und Fakultätsgrenzen hinaus – sind wir auf der Suche nach Möglichkeiten, um mit einem ganzheitlichen STEAM-Ansatz die Grundlagen des Quantum Computing zu vermitteln und allgemein Quantum Awareness zu steigern. Das Poster zeigt die bisherigen Aktivitäten (Lehre, Forschung, Outreach) bei uns und die geplante Weiterentwicklung des Curriculums (u.a. in Richtung Quantum Games).',''),
  mockPoster('','A single-photon double-slit experiment and its interactive implementation','Oliver Burmeister','The observation of interference in a double-slit experiment with single quantum objects is, as emphasized by Feynman, a phenomenon that "has in it the heart of quantum physics." In the Lower Saxony upper secondary physics curriculum, quantum objects such as neutrons, buckyballs, and photons are discussed in the context of the double-slit experiment to address mandatory competencies. To translate these requirements into classroom practice, the NUN group developed a comprehensive quantum physics course, which has been jointly revised in recent years by NUN and foeXlab. Within this course, quantitative measurement data from neutron and buckyball experiments are used to introduce the concept of quantum objects and the de Broglie relation, whereas single photons have so far been treated mainly qualitatively. To address this gap, a master\'s thesis project implemented a double-slit setup into an existing single-photon experiment. The observed interference pattern, together with missing coincidences at an optical beam splitter, provides experimental evidence for single-photon interference. The experimental data were transferred into an interactive screen experiment to enable use in student labs and classrooms. This poster presents the experimental realization, its educational implementation, and planned revisions.',''),
];

function mockWorkshop(slot, track, title_de, title_en, institution){
  return { id: Math.random().toString(36).slice(2,9), slot, track, title_de, title_en, institution };
}

const WORKSHOP_SET = [
  ['A', 'PHODE – A low cost experimental setup for wave-particle duality', 'PHODE – A low cost experimental setup for wave-particle duality', 'RWTH Aachen University'],
  ['A', 'Quantum Optics on The Bench: Ein modularer Experimentierbaukasten für die Quantenoptik', 'Quantum Optics on The Bench: Ein modularer Experimentierbaukasten für die Quantenoptik', 'TECHNOSEUM Mannheim'],
  ['B', 'Quantum AR Lab-App', 'Quantum AR Lab-App', 'Universität Leipzig'],
  ['B', 'O3Q – Low-Cost Experimente zur Wellen- und Quantenoptik', 'O3Q – Low-Cost Experimente zur Wellen- und Quantenoptik', 'Universität Münster']
];

const MOCK_WORKSHOPS = [1, 2].flatMap(slot =>
  WORKSHOP_SET.map(([track, de, en, inst]) => mockWorkshop(slot, track, de, en, inst))
);

const MOCK_ALLG = {
  'Titel (DE)': 'QuBIT EDU Zeitplan',
  'Titel (EN)': 'QuBIT EDU Schedule',
  'Untertitel (DE)': 'Programmübersicht',
  'Untertitel (EN)': 'Programme overview',
  'Ankündigung (DE)': '',
  'Ankündigung (EN)': ''
};

async function loadAll(){
  // ENTWURFSMODUS: kein Netzwerk-Fetch, nur die eingefrorene Kopie oben verwenden.
  state.days = MOCK_DAYS;
  state.lageplan = MOCK_LAGEPLAN;
  state.allg = MOCK_ALLG;
  state.posters = MOCK_POSTERS;
  state.workshops = MOCK_WORKSHOPS;
  render();
}

el('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  lang = btn.dataset.lang;
  render();
});

function timeToMinutes(time){
  if(!time) return 99999;
  const [h, m] = time.split(':').map(Number);
  return h * 60 + m;
}

function trackLabel(track){
  const L = t();
  if(track === 'A') return L.trackA;
  if(track === 'B') return L.trackB;
  return '';
}

function buildWorkshopList(slot){
  const L = t();
  const items = (state.workshops || []).filter(w => w.slot === slot);
  const group = (label, arr) => {
    if(arr.length === 0) return '';
    const rows = arr.map(w => `
      <div class="workshop-item">
        <p class="workshop-title">${escapeHtml(pickLang(w.title_de, w.title_en))}</p>
        <p class="workshop-institution">${escapeHtml(w.institution)}</p>
      </div>
    `).join('');
    return `<div class="workshop-group"><p class="workshop-group-label">${label}</p>${rows}</div>`;
  };
  const html = group(L.trackA, items.filter(w => w.track === 'A')) + group(L.trackB, items.filter(w => w.track === 'B'));
  return `<div class="workshop-list">${html}</div>`;
}

function buildPosterList(){
  const L = t();
  const items = (state.posters || []).map(p => {
    const ptitle = pickLang(p.title_de, p.title_en);
    const hasAbstract = !!p.abstract;
    return `
      <div class="poster-item${hasAbstract ? '' : ' poster-item-flat'}" data-poster-id="${p.id}">
        <div class="poster-item-head">
          <div class="poster-item-text">
            <span class="poster-title">${escapeHtml(ptitle)}</span>
            <span class="poster-author">${escapeHtml(p.author)}</span>
          </div>
          ${hasAbstract ? '<span class="poster-chevron">▸</span>' : ''}
        </div>
        ${hasAbstract ? `<div class="poster-item-body">
          ${p.authors ? `<p class="body-line" style="margin-bottom:6px;"><b>${L.authorsLabel}</b> ${escapeHtml(p.authors)}</p>` : ''}
          <div class="abstract-text">${escapeHtml(p.abstract)}</div>
        </div>` : ''}
      </div>
    `;
  }).join('');
  return `<div class="poster-list">${items}</div>`;
}

function attachPosterListeners(container){
  container.querySelectorAll('.poster-item:not(.poster-item-flat)').forEach(item => {
    item.querySelector('.poster-item-head').addEventListener('click', (e) => {
      e.stopPropagation();
      const id = item.dataset.posterId;
      if(openPosterIds.has(id)) openPosterIds.delete(id); else openPosterIds.add(id);
      item.classList.toggle('open');
    });
    if(openPosterIds.has(item.dataset.posterId)) item.classList.add('open');
  });
}

function buildSessionCard(sess){
  const L = t();
  const type = TYPES[sess.type] || TYPES.sonstiges;
  const title = pickLang(sess.title_de, sess.title_en);
  const isTalk = sess.type === 'vortrag';
  const isPoster = sess.type === 'poster';
  const isWorkshop = sess.type === 'experimentieren' && sess.track === 'both';
  const hasDetails = isPoster
    ? (state.posters && state.posters.length > 0)
    : isWorkshop
      ? (state.workshops && state.workshops.some(w => w.slot === sess.slot))
      : !!(sess.speaker || sess.room || sess.abstract || sess.hinweis);
  const isFull = sess.track === 'both';
  const hasHinweis = !!sess.hinweis;

  const card = document.createElement('div');
  card.className = 'session' + (isFull ? ' full' : '') + (hasHinweis ? ' changed' : '') + (openIds.has(sess.id) ? ' open' : '') + (hasDetails ? '' : ' no-details');

  const timeText = sess.start ? (sess.end ? `${sess.start} – ${sess.end}` : `${lang === 'de' ? 'ab' : 'from'} ${sess.start}`) : '';
  const trackChip = trackLabel(sess.track) ? `<span class="track-chip">${trackLabel(sess.track)}</span>` : '';
  const changedChip = hasHinweis ? `<span class="changed-chip">${L.changed}</span>` : '';

  const tagHtml = isTalk
    ? `<span class="tag" style="background:${type.bg};color:${type.fg}">${escapeHtml(sess.speaker || type[lang])}</span>`
    : '';
  const talkLabel = isTalk && sess.slot ? `${type[lang]} ${sess.slot}` : title;
  const titleHtml = isTalk
    ? `<p class="stitle">${escapeHtml(talkLabel || '')}</p>`
    : `<span class="tag-title" style="background:${type.bg};color:${type.fg}">${escapeHtml(title || '')}</span>`;
  const chevronHtml = hasDetails ? '<span class="chevron">▸</span>' : '';

  const headTopClass = isTalk ? 'head-top head-top-stacked' : 'head-top';

  card.innerHTML = `
    <div class="session-head">
      <span class="time-badge">${timeText}</span>
      <div class="head-main">
        <div class="${headTopClass}">
          ${titleHtml}
          ${tagHtml}
          ${trackChip}
          ${changedChip}
        </div>
      </div>
      ${chevronHtml}
    </div>
    ${hasDetails ? `
    <div class="session-body${(isPoster || isWorkshop) ? ' session-body-wide' : ''}">
      ${sess.hinweis ? `<div class="hinweis-box"><b>${L.hinweisLabel}:</b> ${escapeHtml(sess.hinweis)}</div>` : ''}
      ${isPoster ? buildPosterList() : isWorkshop ? buildWorkshopList(sess.slot) : `
        ${sess.speaker ? `<p class="body-line"><b>${L.speakerLabel}</b> ${escapeHtml(sess.speaker)}</p>` : ''}
        ${isTalk ? `<p class="body-line"><b>${L.titleLabel}</b> ${escapeHtml(title || '')}</p>` : ''}
        ${sess.room ? `<p class="body-line"><b>${sess.type === 'dinner' ? L.locationLabel : L.roomLabel}</b> ${sess.mapsUrl ? `<a href="${sess.mapsUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">${escapeHtml(sess.room)}</a>` : escapeHtml(sess.room)}</p>` : ''}
        ${sess.authors ? `<p class="body-line"><b>${L.authorsLabel}</b> ${escapeHtml(sess.authors)}</p>` : ''}
        ${(() => { const a = (lang === 'en' && sess.abstract_en) ? sess.abstract_en : sess.abstract; return a ? `<div class="abstract-text">${escapeHtml(a)}</div>` : ''; })()}
      `}
    </div>` : ''}
  `;
  if(hasDetails){
    card.querySelector('.session-head').addEventListener('click', () => {
      if(openIds.has(sess.id)) openIds.delete(sess.id); else openIds.add(sess.id);
      card.classList.toggle('open');
    });
    if(isPoster){
      attachPosterListeners(card);
    }
  }
  return card;
}

function groupByStart(sessions){
  const map = new Map();
  sessions.forEach(sess => {
    const key = sess.start || ('_' + sess.id);
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(sess);
  });
  return [...map.values()].sort((a, b) => timeToMinutes(a[0].start) - timeToMinutes(b[0].start));
}

function renderDay(day){
  const wrap = document.createElement('div');
  const L = t();
  if(day.sessions.length === 0){
    wrap.innerHTML = `<p class="empty">${L.noEntries}</p>`;
    return wrap;
  }
  const hasParallelTracks = day.sessions.some(sess => sess.track === 'A' || sess.track === 'B');
  if(hasParallelTracks){
    const header = document.createElement('div');
    header.className = 'track-columns-header';
    header.innerHTML = `
      <div class="track-col-head"><span class="time-gutter"></span><span class="col-label">${L.trackA}</span></div>
      <div class="track-col-head"><span class="time-gutter"></span><span class="col-label">${L.trackB}</span></div>
    `;
    wrap.appendChild(header);
  }
  const groups = groupByStart(day.sessions);
  groups.forEach(group => {
    const bothArr = group.filter(sess => sess.track === 'both');
    const aArr = group.filter(sess => sess.track === 'A');
    const bArr = group.filter(sess => sess.track === 'B');
    bothArr.forEach(sess => wrap.appendChild(buildSessionCard(sess)));
    if(aArr.length > 0 || bArr.length > 0){
      const row = document.createElement('div');
      row.className = 'track-row';
      const colA = document.createElement('div');
      colA.className = 'track-col';
      aArr.forEach(sess => colA.appendChild(buildSessionCard(sess)));
      const colB = document.createElement('div');
      colB.className = 'track-col';
      bArr.forEach(sess => colB.appendChild(buildSessionCard(sess)));
      row.appendChild(colA);
      row.appendChild(colB);
      wrap.appendChild(row);
    }
  });
  return wrap;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderTabs(){
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  state.days.forEach((day, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (i === activeDayIndex ? ' active' : '');
    tab.textContent = pickLang(day.label_de, day.label_en);
    tab.addEventListener('click', () => { activeDayIndex = i; render(); });
    tabs.appendChild(tab);
  });
  return tabs;
}

function renderLageplan(){
  const area = el('lageplanArea');
  area.innerHTML = '';
  if(!state.lageplan || !state.lageplan.link) return;
  const embed = driveEmbedUrl(state.lageplan.link);
  const imgUrl = driveImageUrl(state.lageplan.link);
  if(!embed && !imgUrl) return;
  const L = t();
  const section = document.createElement('div');
  section.className = 'lageplan-section';
  section.innerHTML = `
    <p class="section-title">${L.lageplan}</p>
    <div class="lageplan-frame">
      <img id="lageplanImg" src="${imgUrl || ''}" alt="Lageplan" style="width:100%;height:100%;object-fit:contain;background:var(--paper);display:block;">
      <iframe id="lageplanFallback" src="${embed || ''}" style="display:none;width:100%;height:100%;border:none;" allow="autoplay"></iframe>
    </div>
    ${state.lageplan.caption ? `<p class="lageplan-caption">${escapeHtml(state.lageplan.caption)}</p>` : ''}
  `;
  const img = section.querySelector('#lageplanImg');
  img.addEventListener('error', () => {
    img.style.display = 'none';
    if(embed) section.querySelector('#lageplanFallback').style.display = 'block';
  });
  area.appendChild(section);
}

function render(){
  const L = t();
  const titleKey = lang === 'de' ? 'Titel (DE)' : 'Titel (EN)';
  const subKey = lang === 'de' ? 'Untertitel (DE)' : 'Untertitel (EN)';
  const annKey = lang === 'de' ? 'Ankündigung (DE)' : 'Ankündigung (EN)';

  el('venueLine').innerHTML = `
    <span class="venue-top"><svg width="12" height="12" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/></svg> ${L.venueName}</span>
    <a class="venue-addr" href="https://www.google.com/maps/search/?api=1&query=Cla%C3%9Fenstra%C3%9Fe+11+52072+Aachen" target="_blank" rel="noopener">${L.venueAddress}</a>
  `;
  el('title').textContent = pickLang(state.allg['Titel (DE)'], state.allg['Titel (EN)']) || 'Zeitplan';
  el('subtitle').textContent = pickLang(state.allg['Untertitel (DE)'], state.allg['Untertitel (EN)']);
  el('footerNote').textContent = L.footerHint;

  const ann = state.allg[annKey];
  const annArea = el('announcementArea');
  annArea.innerHTML = ann
    ? `<div class="announcement"><b>${L.ankuendigung}</b>${escapeHtml(ann)}</div>`
    : '';

  el('langSwitch').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  const content = el('mainContent');
  content.innerHTML = '';
  content.appendChild(renderTabs());
  const day = state.days[activeDayIndex] || state.days[0];
  if(day) content.appendChild(renderDay(day));

  renderLageplan();
}

el('subtitle').textContent = STR.de.loading;
loadAll();
</script>
